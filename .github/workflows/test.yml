name: Tests

# CI is temporarily manual-only while the engine and parameters are being
# built. Restore the push / pull_request triggers when the fit is in.
on:
  workflow_dispatch:

env:
  PYTEST_QT_API: pyside6
  QT_API: pyside6
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pytest-cov pytest-xdist numpy scipy rdkit pylint==4.0.9

      - name: Run tests
        run: python -m pytest tests/ -v -n auto --cov=pmeff26_plugin --cov-report=term-missing

      - name: Lint
        run: pylint pmeff26_plugin/ --fail-under=9.0
